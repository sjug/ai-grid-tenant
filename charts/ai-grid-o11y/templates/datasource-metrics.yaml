apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: cluster-prometheus-datasource
  namespace: redhat-ods-monitoring
  annotations:
    # Owned by RHOAI. Retired from this chart in two steps; never pruned or deleted by Argo CD.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  client:
    tls:
      caCert:
        certPath: /ca/service-ca.crt
        type: file
      enable: true
  config:
    default: false
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: http://rbac-query-proxy.open-cluster-management-observability.svc.cluster.local:8080
        scrapeInterval: 5m
