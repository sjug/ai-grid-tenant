apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-config
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
  template:
    metadata:
      name: 'cluster-config-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://github.com/sjug/ai-grid-tenant.git
          targetRevision: HEAD
          path: cluster-config/chart
          helm:
            releaseName: cluster-admins
            # cluster-admins.yaml is per deployment and may be absent.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster-config/values.yaml
              - $values/cluster-config/cluster-admins.yaml
            parameters:
              - name: hubResources.enabled
                value: '{{ eq (index .metadata.labels "local-cluster") "true" | toString }}'
        - repoURL: https://github.com/sjug/ai-grid-tenant.git
          targetRevision: HEAD
          ref: values
      destination:
        server: '{{ if eq (index .metadata.labels "local-cluster") "true" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: openshift-gitops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
  # A managed cluster renders nothing (hubResources.enabled is false). Without
  # allowEmpty Argo CD refuses the automated sync that prunes what an earlier
  # chart created there, such as the per-user cluster-admin bindings, and the
  # Application stays OutOfSync. The hub keeps the protection: an empty hub
  # render would prune its admin Group, binding and Submariner policy. A
  # registration counts as the hub by its local-cluster label, its name or an
  # in-cluster server.
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          allowEmpty: {{ and (ne (index .metadata.labels "local-cluster") "true") (ne .name "local-cluster") (ne .server "https://kubernetes.default.svc") }}
