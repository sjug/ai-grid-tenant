apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # A ManagedClusterView lives on the hub, in the namespace named after the
  # cluster it reads, so one Application per external-services cluster.
  name: external-services-ingress-ca-view
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
            ai-grid/external-services: "true"
  template:
    metadata:
      name: 'external-services-ingress-ca-view-{{ .name | trunc 22 }}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/sjug/ai-grid-tenant.git
        targetRevision: HEAD
        path: apps/external-services/ingress-ca-view
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .name }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
