apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: maas-read
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instances: 1
  bootstrap:
    pg_basebackup:
      database: maas
      owner: maas_api
      secret:
        name: maas-db-app
      source: maas-db
  replica:
    enabled: true
    source: maas-db
  externalClusters:
    - name: maas-db
      connectionParameters:
        host: maas-db-rw.maas-db.svc.clusterset.local
        user: streaming_replica
        sslmode: verify-full
        dbname: postgres
      sslKey:
        name: maas-db-replication
        key: tls.key
      sslCert:
        name: maas-db-replication
        key: tls.crt
      sslRootCert:
        name: maas-db-ca
        key: ca.crt
  storage:
    size: 20Gi
  # A PodMonitor in maas-db for user-workload monitoring: replication lag, connections, transactions,
  # WAL, for the two-entry and key-churn tests (the ACM user-workload job federates cnpg_*).
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
