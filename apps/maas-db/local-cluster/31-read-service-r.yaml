apiVersion: v1
kind: Service
metadata:
  # The read endpoint maas-api uses on every site. A remote site's maas-read is a
  # one-instance replica cluster: CloudNativePG labels that instance role=primary
  # (the designated primary, still in recovery), so its -ro Service, which selects
  # role=replica, never has an endpoint; -r selects every ready instance and does.
  # The hub has no maas-read cluster, so the same name points at the primary
  # cluster's replicas here. maas-read-ro stays as an alias for older readers.
  name: maas-read-r
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    # Part of the primary database: deleting the Application never deletes it.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  type: ExternalName
  externalName: maas-db-ro.maas-db.svc.cluster.local
