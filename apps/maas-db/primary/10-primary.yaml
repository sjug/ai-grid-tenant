apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: maas-db
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # The system of record for every tenant's API keys and subscriptions: Delete=false
    # keeps it when the Application is deleted, and the maas-db ApplicationSet syncs with
    # prune disabled, so removing it from Git never deletes it either.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  instances: 3
  certificates:
    serverAltDNSNames:
      - maas-db-rw.maas-db.svc.clusterset.local
  bootstrap:
    initdb:
      database: maas
      owner: maas_api
  storage:
    size: 20Gi
  # The source-enrolment policy labels CNPG's PodMonitor for RHOAI's collector.
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
