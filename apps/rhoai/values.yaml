skipCrdCheck: true
components:
  aigateway:
    modelsAsAService:
      gateway:
        name: maas-default-gateway
        namespace: openshift-ingress
        annotations:
          ai-grid/maas-gateway-hostname-prefix: maas
        spec:
          infrastructure:
            annotations:
              # Envoy statistics Istio's default matcher drops: ext_proc, ext_authz, the Kuadrant wasm
              # shim and Limitador, downstream and upstream counters. Changing it restarts the gateway pods.
              proxy.istio.io/config: &envoy-stats |
                proxyStatsMatcher:
                  inclusionRegexps:
                    - ".*ext_proc.*"
                    - ".*ext_authz.*"
                    - ".*ratelimit.*"
                    - ".*wasm.*"
                    - "http\\..*\\.downstream_rq_.*"
                    - "http\\..*\\.downstream_cx_.*"
                    - "listener\\..*\\.downstream_cx_.*"
                    - "cluster\\..*\\.upstream_(rq|cx)_.*"
                    - "server\\..*"
                    - "overload\\..*"
                    - "cluster\\..*\\.outlier_detection\\..*"
  kserve:
    gateway:
      spec:
        infrastructure:
          annotations:
            # The same statistics for the serving gateway.
            proxy.istio.io/config: *envoy-stats

operator:
  type: rhoai
  rhoai:
    olm:
      # Nightly catalog (image ref managed in apps/rhoai/nightly.yaml);
      # requires prerequisites distributed by apps/rhoai-prerequisites.
      source: rhoai-catalog-dev
      channel: stable-3.6
      # ACM owns this Red Hat managed Namespace; OSD rejects Argo writes to it.
      createNamespace: false
dependencies:
  opentelemetry:
    olm:
      # Keep aligned with the cert-manager compatibility grant in apps/rhoai-prerequisites/hub/12-otel-cert-manager-policy.yaml.
      namespace: openshift-opentelemetry-operator
  # No GPUs on this deployment's sites; the inference profile would install both operators.
  nfd:
    enabled: false
  nvidiaGPUOperator:
    enabled: false
# The payload's Grid runtimes. Argo renders these charts, not the operator, so
# they name the images the operator's payload ships.
global:
  relatedImages:
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_GATEWAY_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9@sha256:3b59054cd8cc84fa44bd3b77e3d2648f8e28578ec9a298d8cd3128b4c6bfe472

# The ingress profile enrols the consumer gateway's TLS metrics listener in RHOAI's collector;
# this does the same for the provider gateway. The listener needs the NetworkPolicy, whose
# peers the ApplicationSet sets per site.
praxis-provider-gateway:
  networkPolicy:
    enabled: true
  metricsListener:
    fromNamespaces:
      - redhat-ods-monitoring
      - openshift-user-workload-monitoring
    serviceMonitor:
      labels:
        monitoring.opendatahub.io/scrape: "true"

# Performance campaign (2026-11), shedding cell: the consumer gateways answer 429 with Retry-After once every
# site serving a model has been full for full_after_ms, instead of queueing. Revert after the cell.
# Replica cell: two consumer gateway replicas per combined site, each with its own learned routing state.
praxis-gateway:
  replicaCount: 2
  praxisConfig:
    render:
      gridServing:
        siteRoute:
          availability:
            shedding: true
