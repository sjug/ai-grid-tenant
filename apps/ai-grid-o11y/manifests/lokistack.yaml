apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: usage-logs
  namespace: ai-grid-o11y
  annotations:
    # After the wave-1 hook has written the object-storage Secret.
    argocd.argoproj.io/sync-wave: "2"
spec:
  size: 1x.demo
  limits:
    global:
      otlp:
        streamLabels:
          resourceAttributes:
          - name: service.name
          - name: subscription
          - name: model
          - name: response_type
          - name: kubernetes_namespace_name
          - name: cluster_name
          - name: cluster_id
      retention:
        days: 30
  storage:
    schemas:
      - version: v13
        effectiveDate: "2026-10-01"
    secret:
      name: usage-logs-object-storage
      type: s3
    tls:
      caName: openshift-service-ca-bundle
      caKey: service-ca.crt
  # cloud69 carry: LVM Storage on the hub workers; upstream uses gp3-csi (AWS).
  storageClassName: lvms-vg1
  tenants:
    mode: openshift-logging
  managementState: Managed
