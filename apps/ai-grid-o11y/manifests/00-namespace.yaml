# The usage-logs Perses dashboard and datasource live here; CreateNamespace covers only the destination namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ods-monitoring
  annotations:
    # Shared with RHOAI's monitoring: never pruned or deleted by this Application.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-1"
