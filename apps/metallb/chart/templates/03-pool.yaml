{{- if not .Values.pool.range }}
{{- fail "pool.range is required: the metallb ApplicationSet sets it from the ai-grid/metallb-pool label" }}
{{- end }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .Values.pool.name }}
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  addresses:
    - {{ .Values.pool.range | quote }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .Values.pool.name }}
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ipAddressPools:
    - {{ .Values.pool.name }}
