apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: metallb-operator
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
# The MetalLB operator supports only the AllNamespaces install mode; an
# OperatorGroup that targets its own namespace leaves the CSV Failed with
# UnsupportedOperatorGroup. No targetNamespaces selects AllNamespaces.
spec:
  upgradeStrategy: Default
