# Each ExternalSecret makes its own call to the stateless Password generator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grid-tenant-1-realm-sync
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 0s
  target:
    name: grid-tenant-1-realm-sync
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-realm-sync-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grid-tenant-2-realm-sync
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 0s
  target:
    name: grid-tenant-2-realm-sync
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-realm-sync-client-secret
