# AI Grid dashboards for ACM's Grafana. The dashboard loader sidecar of observability-grafana picks up every
# ConfigMap in this namespace labelled grafana-custom-dashboard=true and files it under the folder named in
# the annotation. The JSON files beside this kustomization are generated by
# runbooks/dashboards/generate-dashboards.py (AI Grid repository, outside this fork); edit the generator, not
# the JSON.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: open-cluster-management-observability
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana-custom-dashboard: "true"
    app.kubernetes.io/part-of: ai-grid
  annotations:
    observability.open-cluster-management.io/dashboard-folder: AI Grid
    argocd.argoproj.io/sync-wave: "6"
configMapGenerator:
  - name: grafana-dashboard-ai-grid-grid
    files: [ai-grid-grid.json]
  - name: grafana-dashboard-ai-grid-maas
    files: [ai-grid-maas.json]
  - name: grafana-dashboard-ai-grid-engines
    files: [ai-grid-engines.json]
  - name: grafana-dashboard-ai-grid-gateways
    files: [ai-grid-gateways.json]
  - name: grafana-dashboard-ai-grid-collection
    files: [ai-grid-collection.json]
