# -- Managed cluster name. Set per cluster by the acm-submariner ApplicationSet.
clusterName: ""
# -- Namespace where the Submariner operator is installed.
installNamespace: submariner-operator
# -- Use a load-balancer Service for the Submariner gateways. Bare metal has
# no cloud load balancer, so the gateways use node ports on the worker nodes'
# own addresses instead.
loadBalancerEnable: false
# -- Number of gateway replicas.
gateways: 2
