mode: external
fullnameOverride: grid-bootstrap
# The payload's enrollment image, matching apps/rhoai/values.yaml.
image:
  repository: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9
  digest: sha256:1bebfcd981eba2360fa2b728b2ea382dc6c87b782a987362bed4e62f9998ae31
gridIdentity:
  enabled: true
ca:
  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
grid:
  membership:
    source: Local
managedClusters:
  enabled: true
  networkName: grid
  clusterSet: global
  clusterLabel: ai-grid/enabled
  clusterLabelValue: 'true'
  # The rhoai hub manifests own the shared binding.
  createClusterSetBinding: false
  hubClusterName: local-cluster
external:
  delivery:
    namespace: redhat-ai-grid
  certManager:
    enabled: true
    issuer:
      create: true
      name: grid-ca
    ca:
      # A new grid: cert-manager mints the root CA into this Secret. Keep
      # Generate for the life of the hub.
      mode: Generate
      secretName: grid-ca-key
