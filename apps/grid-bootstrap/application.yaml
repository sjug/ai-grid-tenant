apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-bootstrap
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: https://github.com/sjug/ai-grid-tenant.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/opendatahub-io/odh-gitops.git
      targetRevision: be248f9cfa34b8a9aabcc614d277baa33d4a66e5 # odh-gitops main, grid-enrollment 0.3.0-rc.4, pinned 2026-11-09
      path: charts/rhai-on-openshift-chart/charts/grid-enrollment
      helm:
        releaseName: grid-bootstrap
        valueFiles:
          - $values/apps/grid-bootstrap/values.yaml
    - repoURL: https://github.com/sjug/ai-grid-tenant.git
      targetRevision: main
      path: apps/grid-bootstrap/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ai-grid
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
