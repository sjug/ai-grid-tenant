# Retire the campaign's inference-only monitors. They filled a gap: an inference site had no Kuadrant
# observability, so its serving gateway's full Envoy statistics and its Authorino were never scraped. The
# chart's inference profile enables Kuadrant observability now, so Kuadrant's istio-pod-monitor and
# kuadrant-authorino-monitor cover both on every site, and keeping these would scrape each source twice.
# mustnothave removes the live objects; drop this file once every inference site reports Compliant.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-inference-only
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
          matchExpressions:
            - key: ai-grid/role
              operator: In
              values: [inference]
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-gateway-envoy-metrics
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-gateway-envoy-metrics
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: monitoring.coreos.com/v1
                kind: PodMonitor
                metadata:
                  name: ai-grid-gateway-envoy-stats
                  namespace: openshift-ingress
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-authorino-metrics
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: monitoring.coreos.com/v1
                kind: ServiceMonitor
                metadata:
                  name: ai-grid-authorino-metrics
                  namespace: kuadrant-system
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: rhoai-gateway-envoy-metrics
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "3"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: rhoai-inference-only
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: rhoai-gateway-envoy-metrics
