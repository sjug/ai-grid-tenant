# Monitoring on every cluster, for the AI Grid's own metrics and the performance campaign:
# user-workload monitoring on (the grid, MaaS, EPP and MetalLB ServiceMonitors are scraped
# by nobody without it) and persistent storage and retention for both Prometheus instances.
# The Cluster Observability Operator comes from the RHOAI chart on spokes and from ACM on
# the hub (apps/rhoai/hub/01-applicationset.yaml).
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-monitoring
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-cluster-monitoring
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: cluster-monitoring-config
                  namespace: openshift-monitoring
                data:
                  config.yaml: |
                    enableUserWorkload: true
                    prometheusK8s:
                      # Up to 15 days, size capped at 80 % of the volume (the hub's 1.1 M series,
                      # mostly Istio and Envoy, write tens of GiB a week).
                      retention: 15d
                      retentionSize: 160GiB
                      volumeClaimTemplate:
                        spec:
                          storageClassName: lvms-vg1
                          resources:
                            requests:
                              storage: 200Gi
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: user-workload-monitoring-config
                  namespace: openshift-user-workload-monitoring
                data:
                  config.yaml: |
                    prometheus:
                      retention: 15d
                      retentionSize: 80GiB
                      volumeClaimTemplate:
                        spec:
                          storageClassName: lvms-vg1
                          resources:
                            requests:
                              storage: 100Gi
