apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: limitador-redis-isolation
  namespace: limitador-redis
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - ipBlock:
            cidr: 242.0.0.0/8
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kuadrant-system
          podSelector:
            matchLabels:
              app: limitador
    # The cluster's monitoring (user-workload Prometheus) scrapes the exporter sidecar only.
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - port: 9121
          protocol: TCP
